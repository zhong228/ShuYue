name: Build IPA (unsigned)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. 1.0.0"
        required: false
        default: "1.0.0"
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode (prefer 26, fallback 16)
        run: |
          ls /Applications | grep -i xcode || true
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              VERSION="${GITHUB_REF_NAME#v}"
            else
              VERSION="0.0.0-pr"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build unsigned IPA
        run: |
          chmod +x scripts/build_ipa.sh
          scripts/build_ipa.sh "${{ steps.version.outputs.version }}"

      # Guardrail (Issue #1): an unsigned IPA must NOT embed the restricted
      # entitlements (App Groups / CloudKit / Sign-in-with-Apple). Without a
      # provisioning profile those cause an immediate launch crash under
      # TrollStore / self-signing. Fail the build if they are still present.
      - name: Verify IPA has no restricted entitlements
        run: |
          if unzip -l build/ShuYue-*.ipa | grep -q "archived-expanded-entitlements.xcent"; then
            echo "::error::Restricted entitlements still embedded in IPA (Issue #1 fix regressed)"
            exit 1
          fi
          echo "OK: unsigned IPA contains no embedded restricted entitlements"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShuYue-unsigned-ipa
          path: build/ShuYue-*.ipa
          retention-days: 7

      - name: Create Release and upload IPA
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ShuYue-*.ipa
          generate_release_notes: true
